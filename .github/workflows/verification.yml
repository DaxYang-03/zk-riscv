name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Icarus Verilog and Yosys
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes iverilog yosys

      - name: Select Rust 1.88.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.88.0

      - name: Check formatting and Rust lints
        run: |
          cargo fmt --manifest-path proof/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path proof/Cargo.toml --all-targets -- -D warnings
        env:
          CARGO_TARGET_DIR: build/cargo

      - name: Run regressions, formal checks and proof demo
        run: make evidence

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: verification-evidence
          path: |
            build/evidence/run-*/report.json
            build/evidence/run-*/*.log
            build/evidence/run-*/trace.csv
            build/evidence/run-*/proof.bin
          if-no-files-found: ignore
          retention-days: 14
