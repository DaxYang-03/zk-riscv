[project]
name = "zk-riscv-service"
version = "0.2.0"
description = "Durable job API and client for zk-RISC-V execution proofs"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
]

[project.scripts]
zk-riscv = "zkclient.__main__:main"
zk-riscv-service = "zkservice.__main__:main"

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zkservice", "zkclient"]

[tool.pytest.ini_options]
testpaths = ["tests"]
